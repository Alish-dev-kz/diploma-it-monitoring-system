<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITMon — мониторинг</title>
<style>
:root{
  --bg:#2b2c31; --rail:#232428; --card:#33343a; --card2:#3a3b42; --bd:#404149; --tx:#e9e9ee; --mut:#8d8e97; --dim:#62636b;
  --acc:#7c5cff; --acc2:#9b85ff; --ok:#3ecf8e; --warn:#f5b544; --crit:#ff5c5c; --off:#6b6c74;
  --r:4px; --font:"Segoe UI","DejaVu Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--font)}
a{color:var(--acc2);cursor:pointer;text-decoration:none}
button,input,select{font:inherit;color:var(--tx)}
/* layout */
.app{display:grid;grid-template-columns:96px 1fr;min-height:100vh}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;position:sticky;top:0;height:100vh}
.logo{width:40px;height:40px;display:grid;place-items:center;margin-bottom:18px}
.ri{position:relative;width:96px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;color:var(--mut);cursor:pointer;border-left:3px solid transparent}
.ri .nm{font-size:10px;line-height:1.15;text-align:center;letter-spacing:.01em}
.ri:hover{color:var(--tx)}.ri.on{color:var(--acc2);border-left-color:var(--acc);background:rgba(124,92,255,.08)}
.ri svg{width:20px;height:20px}
.ri .dot{position:absolute;top:4px;right:28px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
.ri .tip{position:absolute;left:70px;background:#111;color:#fff;font-size:12px;padding:4px 8px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none;z-index:9}
.ri:hover .tip{opacity:1}
.rail .sp{flex:1}
.main{padding:0 28px 28px;min-width:0}
.top{display:flex;align-items:center;gap:14px;height:64px;border-bottom:1px solid var(--bd);margin-bottom:20px}
.top h1{font-size:22px;font-weight:400;margin:0}.top .back{color:var(--mut);cursor:pointer;font-size:20px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--mut);font-size:13px}
.layout{display:grid;grid-template-columns:200px 1fr;gap:24px}
.sub .bt{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:7px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;margin-bottom:4px}
.sub .bt.on{background:var(--card2);color:var(--tx)}
/* components */
.card{background:var(--card);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;position:relative}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.big{font-size:30px;font-weight:300}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{background:var(--acc);border:0;color:#fff;padding:9px 18px;border-radius:var(--r);cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.btn:hover{background:#6c4cf0}.btn.ghost{background:var(--card2);color:var(--tx)}.btn.ghost:hover{background:#45464e}
.btn.sm{padding:6px 12px}.btn.danger{background:transparent;border:1px solid var(--crit);color:var(--crit)}
.btn:disabled{opacity:.45;cursor:default}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.tabs{display:flex;gap:26px;border-top:1px solid var(--bd);margin:14px -20px -18px;padding:0 20px}
.tabs a{color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:12px 0;border-bottom:2px solid transparent}
.tabs a.on{color:var(--tx);border-color:var(--acc)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.offline{color:var(--off)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--mut)}
.pill.ok{background:rgba(62,207,142,.12);color:var(--ok)}.pill.warn{background:rgba(245,181,68,.12);color:var(--warn)}
.pill.crit{background:rgba(255,92,92,.12);color:var(--crit)}.pill.run{background:rgba(124,92,255,.15);color:var(--acc2)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:11px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}tr.click{cursor:pointer}tr.click:hover td{background:rgba(124,92,255,.10)}
tr.click:hover .open,.card.dv:hover .open{color:#fff;background:var(--acc)}
.open{display:inline-block;font-size:12px;color:var(--acc2);border:1px solid var(--acc);border-radius:var(--r);padding:3px 10px;white-space:nowrap}
.card.dv{cursor:pointer;border:1px solid transparent}.card.dv:hover{border-color:var(--acc)}
.mut{color:var(--mut);font-size:12px}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:12.5px}
pre{background:var(--bg);border-radius:var(--r);padding:10px 12px;margin:6px 0 12px;white-space:pre;overflow:auto;max-height:220px}
.res{border-left:3px solid transparent;padding-left:10px;margin-bottom:4px}.res.new{border-left-color:var(--acc);background:rgba(124,92,255,.07);border-radius:var(--r);padding:8px 10px}
.wait{color:var(--acc2);font-size:13px;padding:8px 0 12px}.wait:before{content:"⏳ "}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.av{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--acc2);flex:none}
.av svg{width:20px;height:20px}
.dev{display:grid;grid-template-columns:220px 1fr 1fr 1fr 150px 110px;gap:24px;align-items:center}
.minibar{height:4px;background:var(--card2);border-radius:2px;margin-top:6px;overflow:hidden}.minibar i{display:block;height:100%;background:var(--acc)}
.err{color:var(--crit);font-size:13px;min-height:18px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--card2);border-left:3px solid var(--acc);padding:12px 16px;border-radius:var(--r);max-width:380px;z-index:50}
.toast.bad{border-color:var(--crit)}
/* login */
.login{min-height:100vh;display:grid;place-items:center}
.login .card{width:360px;padding:30px}
.login input{width:100%;margin-top:6px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.dev{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
</style></head><body>

<div id="loginv" class="login" hidden><div class="card">
  <div class="row" style="margin-bottom:20px"><span id="logo1"></span><div><b style="font-size:18px">ITMon</b><div class="mut">Компьютерлерді орталықтандырылған мониторингтеу</div></div></div>
  <div class="lbl">Логин</div><input id="u" autocomplete="username">
  <div class="lbl" style="margin-top:14px">Құпия сөз</div><input id="p" type="password" autocomplete="current-password">
  <div class="err" id="lerr" style="margin:10px 0"></div>
  <button class="btn" style="width:100%" onclick="doLogin()">Кіру</button>
  <div class="mut" style="margin-top:14px">Бір минутта 5 рет қате енгізсеңіз, кіру уақытша бұғатталады</div>
</div></div>

<div id="appv" class="app" hidden>
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <div class="top"><span class="back" id="back" hidden onclick="history.back()">‹</span><h1 id="title"></h1>
      <div class="right"><span id="upd"></span><span id="who"></span><button class="btn ghost sm" onclick="logout()">Шығу</button></div></div>
    <div id="view"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
// ---------- helpers ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(n,u='%')=>n==null?'—':Math.round(n)+u;
const ICON={
 logo:'<svg viewBox="0 0 40 24" width="40" height="24" fill="none" stroke="#7c5cff" stroke-width="3.2"><path d="M12 4a8 8 0 1 0 0 16c6 0 10-16 16-16a8 8 0 1 1 0 16c-6 0-10-16-16-16z"/></svg>',
 dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-4"/></svg>',
 dev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>',
 alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
 cmd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>',
 thr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
 rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
 audit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6M9 7h2"/></svg>',
 users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 13.5a7 7 0 0 1 4 6.5"/></svg>',
};
const ST={ok:'қалыпты',warn:'назар',crit:'қауіпті',offline:'байланыс жоқ'};
const CST={pending:['кезекте',''],running:['орындалуда','run'],done:['орындалды','ok'],expired:['TTL өтті','warn'],failed:['қате','crit']};
const CMDS=[['top_processes','Процестер'],['disk_usage','Дискілер'],['uptime','Жұмыс уақыты'],['ping_test','Желі']];
const CMDNAME=Object.fromEntries(CMDS);
const ROLE={'Администратор':'Әкімші','Сотрудник':'Инженер'};
const ACT={login:'Кіру',login_failed:'Сәтсіз кіру',command:'Команда',agent_enrolled:'Агент тіркелді',enroll_failed:'Тіркеу қатесі',agent_revoked:'Агент кері қайтарылды',user_create:'Пайдаланушы құрылды',user_update:'Пайдаланушы өзгертілді',role_create:'Рөл құрылды',role_update:'Рөл өзгертілді',thresholds_update:'Шекті мәндер өзгертілді',report_export:'Есеп жүктелді'};
const fmtTime=t=>t?new Date(t*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const ago=t=>{if(!t)return'ешқашан';const s=Math.max(0,Date.now()/1000-t);return s<60?Math.round(s)+' с бұрын':s<3600?Math.round(s/60)+' мин бұрын':s<86400?Math.round(s/3600)+' сағ бұрын':Math.round(s/86400)+' күн бұрын'};
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,3500)}

let tok=null,me=null,timer=null,TH={};
const can=p=>me&&me.permissions.includes(p);
async function api(url,opt={}){
  opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},tok?{Authorization:'Bearer '+tok}:{});
  const r=await fetch(url,opt);
  if(r.status===401&&tok){logout();throw new Error('401')}
  if(opt.raw){if(!r.ok)throw new Error('Қате '+r.status);return r}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:(Array.isArray(d.detail)?'Мәндер дұрыс емес':'Қате '+r.status));
  return d;
}

// ---------- charts ----------
function ring(value,label,color,size=120){
  const r=size/2-8,c=2*Math.PI*r,v=Math.max(0,Math.min(100,value??0));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#45464e" stroke-width="3"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"
     stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
   <text x="50%" y="48%" text-anchor="middle" fill="#e9e9ee" font-size="${size/5}" font-weight="300">${value==null?'—':Math.round(value)}<tspan font-size="${size/10}">${value==null?'':'%'}</tspan></text>
   <text x="50%" y="66%" text-anchor="middle" fill="#8d8e97" font-size="10" letter-spacing="1">${label}</text></svg>`;
}
const lvlColor=(v,t)=>v==null||!t?'var(--acc)':v>=t.crit?'var(--crit)':v>=t.warn?'var(--warn)':'var(--acc)';
// bar chart: one bar per bucket, red if over threshold
function bars(data,key,thr,W=560,H=150,n=24){
  if(!data.length)return '<div class="mut" style="padding:40px 0;text-align:center">Бұл кезеңде деректер жоқ</div>';
  const per=Math.ceil(data.length/n),b=[];
  for(let i=0;i<data.length;i+=per){const s=data.slice(i,i+per).map(d=>d[key]).filter(v=>v!=null);b.push({v:s.length?Math.max(...s):null,ts:data[i].ts})}
  const bw=(W-40)/b.length,Y=v=>H-18-(v/100)*(H-30);
  let g=[0,50,100].map(v=>`<line x1="34" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#45464e" stroke-dasharray="${v?'0':'0'}"/><text x="0" y="${Y(v)+4}" font-size="10" fill="#8d8e97">${v}</text>`).join('');
  if(thr)g+=`<line x1="34" x2="${W}" y1="${Y(thr.crit)}" y2="${Y(thr.crit)}" stroke="#ff5c5c" stroke-dasharray="4 4" opacity=".7"/>`;
  b.forEach((x,i)=>{if(x.v==null)return;const h=Math.max(2,H-18-Y(x.v)),c=thr&&x.v>=thr.crit?'#ff5c5c':thr&&x.v>=thr.warn?'#f5b544':'#7c5cff';
    g+=`<rect x="${38+i*bw+bw*.22}" y="${Y(x.v)}" width="${bw*.56}" height="${h}" fill="${c}" rx="1"><title>${Math.round(x.v)}% · ${fmtTime(x.ts)}</title></rect>`});
  const first=b[0].ts,last=b[b.length-1].ts;
  g+=`<text x="38" y="${H-2}" font-size="10" fill="#8d8e97">${fmtTime(first).slice(-8,-3)}</text><text x="${W}" y="${H-2}" font-size="10" fill="#8d8e97" text-anchor="end">${fmtTime(last).slice(-8,-3)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function spark(data,key,W=150,H=36){
  if(data.length<2)return '<span class="mut">—</span>';
  const t0=data[0].ts,t1=data.at(-1).ts,X=t=>(t-t0)/(t1-t0||1)*W,Y=v=>H-2-(v||0)/100*(H-4);
  const pts=data.map(d=>X(d.ts)+','+Y(d[key])).join(' ');
  return `<svg width="${W}" height="${H}"><polygon points="0,${H} ${pts} ${W},${H}" fill="rgba(124,92,255,.25)"/><polyline points="${pts}" fill="none" stroke="#7c5cff" stroke-width="1.5"/></svg>`;
}

// ---------- routing ----------
const PAGES=[
 ['dash','Басқару тақтасы','dash','view_devices','Тақта'],['devices','Құрылғылар','dev','view_devices','Құрылғылар'],['alerts','Ескертулер','alert','view_devices','Ескертулер'],
 ['commands','Командалар кезегі','cmd','view_devices','Командалар'],['thresholds','Шекті мәндер','thr','view_devices','Шекті мәндер'],['reports','Есептер','rep','export_reports','Есептер'],
 ['audit','Журнал','audit','view_audit','Журнал'],['users','Пайдаланушылар','users','manage_users','Пайдала-<br>нушылар']];
let route={page:'dash',id:null,range:15,filter:'all',repDays:7};
function go(page,id=null){location.hash=page+(id?'/'+encodeURIComponent(id):'')}
window.addEventListener('hashchange',()=>{readHash();render(true)});
function readHash(){const [p,id]=location.hash.slice(1).split('/');route.page=PAGES.some(x=>x[0]===p)||p==='device'?p:'dash';route.id=id?decodeURIComponent(id):null}
function drawRail(alertCount){
  $('rail').innerHTML='<div class="logo">'+ICON.logo+'</div>'+PAGES.filter(p=>can(p[3])).map(p=>{
    const on=route.page===p[0]||(route.page==='device'&&p[0]==='devices');
    const dot=p[0]==='alerts'&&alertCount?'<span class="dot">'+alertCount+'</span>':'';
    return `<div class="ri ${on?'on':''}" onclick="go('${p[0]}')">${ICON[p[2]]}${dot}<span class="nm">${p[4]}</span></div>`}).join('')+'<div class="sp"></div>';
}
async function render(full){
  try{
    const p=PAGES.find(x=>x[0]===route.page);
    $('title').textContent=route.page==='device'?'Құрылғы':p[1];$('back').hidden=route.page!=='device';
    const v=await (VIEWS[route.page]||VIEWS.dash)(full);
    if(v!==undefined)$('view').innerHTML=v;
    $('upd').textContent='Жаңартылды '+new Date().toLocaleTimeString('ru-RU');
  }catch(e){if(e.message!=='401')$('view').innerHTML='<div class="card err">'+esc(e.message)+'</div>'}
}
let agentsCache=[];
async function loadAgents(){agentsCache=await api('/api/agents');const n=agentsCache.filter(a=>a.status==='crit'||a.status==='warn').length;drawRail(n);return agentsCache}
async function loadTH(){const t=await api('/api/thresholds');TH=Object.fromEntries(t.map(x=>[x.metric,x]));return t}

// ---------- views ----------
const VIEWS={};
VIEWS.dash=async()=>{
  const [ags,cmds]=await Promise.all([loadAgents(),api('/api/commands?limit=8')]);await loadTH();
  const on=ags.filter(a=>a.online).length,prob=ags.filter(a=>a.status==='crit'||a.status==='warn').length,q=cmds.filter(c=>c.status==='pending'||c.status==='running').length;
  const hist=await Promise.all(ags.map(a=>api('/api/agents/'+a.id+'/metrics?minutes=15').catch(()=>[])));
  const pOn=ags.length?on/ags.length*100:0;
  let h=`<div class="card"><div class="row between"><div><div class="lbl">Құрылғылар</div><div class="big">${ags.length}</div></div>
    <div class="row" style="gap:40px"><div><div class="lbl">Онлайн</div><div class="big" style="color:var(--ok)">${on}</div></div>
    <div><div class="lbl">Мәселе</div><div class="big" style="color:${prob?'var(--crit)':'var(--tx)'}">${prob}</div></div>
    <div><div class="lbl">Кезектегі команда</div><div class="big" style="color:var(--acc2)">${q}</div></div>
    ${ring(pOn,'ОНЛАЙН','#7c5cff',96)}</div></div></div>`;
  h+=ags.map((a,i)=>devRow(a,hist[i])).join('')||'<div class="card mut">Агенттер әлі тіркелмеген. Компьютерде agent.py іске қосыңыз.</div>';
  h+=`<div class="card"><div class="row between"><div class="lbl">Соңғы командалар</div><a onclick="go('commands')">Барлығы →</a></div>${cmdTable(cmds.slice(0,5),true)}</div>`;
  return h;
};
function devRow(a,m){
  const l=a.last||{};
  const bar=(k,label)=>`<div><div class="lbl">${label}</div><div style="font-size:22px;font-weight:300;color:${a.online?lvlColor(l[k],TH[k]):'var(--dim)'}">${pct(l[k])}</div><div class="minibar"><i style="width:${l[k]||0}%;background:${lvlColor(l[k],TH[k])}"></i></div></div>`;
  return `<div class="card dv" onclick="go('device','${esc(a.id)}')"><div class="dev">
    <div class="row"><div class="av">${ICON.dev}</div><div><b>${esc(a.hostname)}</b><div><span class="st ${a.status}">${ST[a.status]}</span></div></div></div>
    ${bar('cpu','CPU')}${bar('ram','RAM')}${bar('disk','Диск')}
    <div><div class="lbl">CPU, 15 мин</div>${spark(m||[],'cpu')}</div><div style="text-align:right"><span class="open">Ашу →</span></div></div>
    ${a.issues.length&&a.status!=='ok'?`<div class="mut" style="margin-top:10px;color:${a.status==='offline'?'var(--mut)':'var(--'+a.status+')'}">${a.issues.map(esc).join(' · ')}</div>`:''}</div>`;
}

function cmdTable(cmds,compact){
  const now=Date.now()/1000;
  return `<table><tr><th>#</th><th>Құрылғы</th><th>Команда</th><th>Күйі</th>${compact?'':'<th>Әрекет</th><th>TTL</th>'}<th>Кім</th><th>Уақыты</th></tr>
   ${cmds.map(c=>{const ttl=c.status==='pending'&&c.expires_at?Math.max(0,c.expires_at-now):null;
     return `<tr class="click" onclick="go('device','${esc(c.agent_id)}')"><td class="mut">${c.id}</td><td><b>${esc(c.hostname)}</b></td><td>${esc(CMDNAME[c.name]||c.name)} <span class="mut mono">${esc(c.name)}</span></td><td>${cpill(c)}</td>
     ${compact?'':`<td>${c.attempts}/${c.max_attempts}</td><td class="${ttl!=null&&ttl<60?'warn':'mut'}">${ttl!=null?Math.floor(ttl/60)+':'+String(Math.floor(ttl%60)).padStart(2,'0')+' қалды':'—'}</td>`}
     <td class="mut">${esc(c.created_by)}</td><td class="mut">${fmtTime(c.created)}</td></tr>`}).join('')||'<tr><td colspan="8" class="mut">Командалар жоқ</td></tr>'}</table>`;
}

async function addR(){try{await api('/api/roles',{method:'POST',body:JSON.stringify({name:$('rn').value,permissions:[...document.querySelectorAll('.rp:checked')].map(x=>x.value)})});toast('Рөл құрылды');render(true)}catch(e){toast(e.message,1)}}

// ---------- auth ----------
async function doLogin(){
  $('lerr').textContent='';
  try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});
    tok=d.token;me=d.user;try{sessionStorage.setItem('tok',tok)}catch(e){}start()}
  catch(e){$('lerr').textContent=e.message}
}
function logout(){tok=null;me=null;try{sessionStorage.removeItem('tok')}catch(e){}clearInterval(timer);$('appv').hidden=true;$('loginv').hidden=false;$('p').value=''}
function start(){
  $('loginv').hidden=true;$('appv').hidden=false;$('who').textContent=me.username+' · '+(ROLE[me.role]||me.role);
  readHash();if(!PAGES.find(p=>p[0]===route.page&&can(p[3]))&&route.page!=='device'){const f=PAGES.find(p=>can(p[3]));route.page=f?f[0]:'dash'}
  drawRail(0);render(true);clearInterval(timer);timer=setInterval(()=>{if(!['reports','audit'].includes(route.page))render(false)},4000);
}
$('logo1').innerHTML=ICON.logo;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('loginv').hidden)doLogin()});
(async()=>{let t=null;try{t=sessionStorage.getItem('tok')}catch(e){}
  if(t){tok=t;try{me=await api('/api/auth/me');return start()}catch(e){tok=null}}
  $('loginv').hidden=false})();
</script></body></html>
